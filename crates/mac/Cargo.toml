[package]
name = "agent-controller-mac"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "agent_controller_mac"
path = "src/lib.rs"

[dependencies]
agent-controller-core = { path = "../core" }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true

# macOS-only: Accessibility API + CoreGraphics. (Pinned to the `accessibility`
# crate's core-foundation 0.9 so AX types interoperate without a version split.)
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = { version = "0.23", features = ["highsierra", "elcapitan"] }
accessibility = "0.1"
accessibility-sys = "0.1"

[[example]]
name = "spike"
path = "examples/spike.rs"
