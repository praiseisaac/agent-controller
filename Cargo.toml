[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/ios-sim",
    "crates/mac",
    "crates/firefox",
    "crates/chrome",
    "crates/safari",
    "crates/android-emu",
    "crates/windows",
    "app",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
dirs = "5"
tracing = "0.1"
